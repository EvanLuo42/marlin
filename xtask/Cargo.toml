[package]
name = "xtask"
description = "Build orchestration for Marlin: `cargo xtask <command>`."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Only `parse` (no std, no serde): features unify across the workspace, and anything more would
# reach the no_std game binary through marlin-config.
toml = { workspace = true, features = ["parse"] }

[lints]
workspace = true
