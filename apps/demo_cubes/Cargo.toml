[package]
name = "marlin-demo-cubes"
description = "Demo: a field of spinning cubes in an ECS world, drawn by marlin-render, flown through with a free camera."
version.workspace = true
edition.workspace = true
publish.workspace = true

# no_std binary: a std test harness would bring a second panic handler.
[[bin]]
name = "marlin-demo-cubes"
path = "src/main.rs"
test = false
bench = false

[dependencies]
marlin-app.workspace = true
marlin-diag.workspace = true
marlin-ecs.workspace = true
marlin-error.workspace = true
marlin-input.workspace = true
marlin-jobs.workspace = true
marlin-math.workspace = true
marlin-render.workspace = true
marlin-rhi.workspace = true
marlin-rt.workspace = true
marlin-time.workspace = true

[lints]
workspace = true
