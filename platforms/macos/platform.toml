# Platform manifest, read by `cargo xtask`.
name = "macos"
family = "desktop"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# See platforms/windows/platform.toml. Every Intel Mac supported by current macOS has AVX2.
target-cpu = { x86_64 = "x86-64-v3" }
# Planned: crash_dump. No hybrid_cores: ThreadPriority maps to QoS classes,
# which already steer threads between P and E cores.
ext = ["vmem_alias", "dylib"]

# See platforms/windows/platform.toml.
[cook]
texture-compression = ["bc"]
texture-layout = "linear"
head-codec = "zstd"
bulk-codec = "zstd"
