# Platform manifest, read by `cargo xtask`.
name = "linux"
family = "desktop"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# See platforms/windows/platform.toml.
target-cpu = { x86_64 = "x86-64-v3" }
# Planned: crash_dump.
ext = ["large_pages", "vmem_alias", "dylib"]

# See platforms/windows/platform.toml.
[cook]
texture-compression = ["bc"]
texture-layout = "linear"
head-codec = "zstd"
bulk-codec = "zstd"
shader-target = "vulkan-1.4"
