# Platform manifest, read by `cargo xtask`.
name = "windows"
family = "desktop"
# Rust target triples. The first one is the default for `cargo xtask build`.
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
# Minimum CPU per architecture (`-Ctarget-cpu`). x86-64-v3: AVX2, FMA, BMI1/2, i.e. Intel Haswell
# (2013) / AMD Zen (2017) and later; ~96% of Steam users as of September 2026.
target-cpu = { x86_64 = "x86-64-v3" }
# Capabilities this platform's backends implement; each becomes `--cfg marlin_ext="<name>"`.
# Listing a capability that a backend does not implement is a compile error.
# Planned: direct_storage, cpu_markers.
ext = ["large_pages", "hybrid_cores", "vmem_alias", "crash_dump", "dylib", "gyro", "adaptive_triggers", "haptics"]

# What the cooker produces for this platform (read by marlin-cook-core; see its `platform` module).
[cook]
# Block-compression families the platform's GPUs sample, preferred first: "bc", "astc", "etc2".
texture-compression = ["bc"]
# Texture memory layout: "linear", or "tiled" (swizzled by the platform's tiler).
texture-layout = "linear"
# Package codecs (marlin_compress names) of unit heads, decoded on the CPU, and of bulk blobs.
head-codec = "zstd"
bulk-codec = "zstd"
# The shader compiler target engine and game shaders are cooked for (marlin-shaderc target names).
shader-target = "vulkan-1.4"
