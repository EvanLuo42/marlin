[package]
name = "marlin-cook-core"
description = "Cook pipeline: dependency graph, derived data cache and packaging."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
marlin-asset.workspace = true
marlin-asset-db.workspace = true
marlin-compress = { workspace = true, features = ["encode"] }
marlin-error.workspace = true
marlin-hash.workspace = true
marlin-masset.workspace = true
marlin-reflect.workspace = true
marlin-serial.workspace = true

# Reads the `[cook]` tables of platforms/*/platform.toml (see build.rs).
[build-dependencies]
toml = { workspace = true, features = ["parse"] }

[dev-dependencies]
marlin-math.workspace = true
marlin-test-support.workspace = true
# The package tests load through the runtime's IO queue and job system.
marlin-io.workspace = true
marlin-jobs.workspace = true

[lints]
workspace = true
