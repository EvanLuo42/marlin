[package]
name = "marlin-cook-texture"
description = "Texture import, compression and platform swizzling."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
image.workspace = true
marlin-asset.workspace = true
marlin-cook-core.workspace = true
marlin-math.workspace = true
marlin-reflect.workspace = true
marlin-render.workspace = true
# The copy alignments cooked textures are laid out in.
marlin-rhi.workspace = true
marlin-serial.workspace = true

# Console texture tiling, from the private platform repositories cloned into platforms/<name>/
# (see platforms/README.md and src/tiling.rs). Enabling one without its repository fails to build.
[features]
ps5 = []
xbox = []
switch2 = []

[dev-dependencies]
marlin-bench.workspace = true
marlin-compress.workspace = true
marlin-test-support.workspace = true
# The GPU conformance test uploads encoded textures.
marlin-gpu-test-support.workspace = true
marlin-asset-db.workspace = true

[[bench]]
name = "encode"
harness = false

[lints]
workspace = true
