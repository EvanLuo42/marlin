[package]
name = "marlin-bench"
description = "The workspace's benchmark harness for `benches/*.rs` with `harness = false`: warm-up, repeated samples, median and p10/p90, throughput, and JSON results under target/bench/."
version.workspace = true
edition.workspace = true
publish.workspace = true

# A dev-dependency only. marlin-time is L0 and std-free, so every crate from runtime/base up can
# take this without a layering problem (check-layers ignores dev-dependencies).
[dependencies]
marlin-time.workspace = true

[lints]
workspace = true
