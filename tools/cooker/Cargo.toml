marlin-cook-core.workspace = true
marlin-cook-level.workspace = true
marlin-cook-mesh.workspace = true
marlin-cook-shader.workspace = true
marlin-cook-text.workspace = true
marlin-cook-texture.workspace = true
marlin-framework.workspace = true
marlin-masset.workspace = true
marlin-render.workspace = true
marlin-store.workspace = true
marlin-vcs.workspace = true

[dev-dependencies]
marlin-test-support.workspace = true
# Writes the test project's source image.
image.workspace = true

[lints]
workspace = true
