# The sample's boot configuration (see marlin_framework::boot).
# Cook and package the engine's content and the sample first:
#   marlin-cook cook content/engine  then  marlin-cook package content/engine
#   marlin-cook cook samples/basic   then  marlin-cook package samples/basic
# Or stream the sample from a running cook service instead: +content.cookd 127.0.0.1:47200

[content]
engine = "../../content/engine/.marlin/build/{platform}.mpak"
package = ".marlin/build/{platform}.mpak"

[game]
level = "01992d00-0000-7000-8000-000000000001"
