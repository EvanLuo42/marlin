[package]
name = "marlin-fuzz"
description = "libFuzzer targets for the runtime's parsers and decoders (docs/design/0014-testing.md §7.3)."
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, not a member of the root one: `cargo test --workspace` never builds it, and
# it is only built by `cargo xtask test --tier fuzz` with the sanitizer flags.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
marlin-asset = { path = "../runtime/engine/asset" }
marlin-compress = { path = "../runtime/core/compress", features = ["encode"] }
marlin-front-syntax = { path = "../compiler/front/syntax" }
marlin-hash = { path = "../runtime/core/hash" }
marlin-reflect = { path = "../runtime/core/reflect" }
marlin-serial = { path = "../runtime/core/serial" }
marlin-shaderc-backend-spirv = { path = "../compiler/shader/backend_spirv" }
marlin-shaderc-ir = { path = "../compiler/shader/ir" }
marlin-shaderc-opt = { path = "../compiler/shader/opt" }
marlin-text = { path = "../runtime/core/text" }

[profile.release]
# Symbolized stacks in crash reports.
debug = 1

# Targets are named `<crate>_<what>`; `cargo xtask test --tier fuzz` copies a crash to that
# crate's tests/data/regress/<target>/.

[[bin]]
name = "front_syntax_parse"
path = "fuzz_targets/front_syntax_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shaderc_ir_parse"
path = "fuzz_targets/shaderc_ir_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shaderc_opt_pipeline"
path = "fuzz_targets/shaderc_opt_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
