[package]
name = "marlin-compress"
description = "In-house zstd, LZ4 and GDeflate codecs for package chunks."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Encoders, for cooking tools. The shipping runtime only decodes.
encode = []

[dependencies]
marlin-hash.workspace = true
marlin-std.workspace = true

[dev-dependencies]
marlin-compress = { path = ".", features = ["encode"] }
marlin-bench.workspace = true
marlin-test-support.workspace = true

[[bench]]
name = "codecs"
harness = false

[lints]
workspace = true
