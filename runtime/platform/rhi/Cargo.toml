[package]
name = "marlin-rhi"
description = "Rendering hardware interface over D3D12, Vulkan, Metal and console GPU APIs."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
marlin-error.workspace = true

# D3D12 and DXGI are not in windows-sys; their COM interfaces are bound by hand in
# src/backend/d3d12/com.rs. windows-sys covers the Win32 parts. marlin-diag carries the debug
# layer's messages, marlin-pal shares the Win32 helpers and marlin-sync guards the descriptor
# free lists; they move to [dependencies] once another backend needs them.
[target.'cfg(windows)'.dependencies]
marlin-diag.workspace = true
marlin-pal.workspace = true
marlin-sync.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
marlin-app.workspace = true
