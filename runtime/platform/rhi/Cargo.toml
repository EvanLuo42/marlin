[package]
name = "marlin-rhi"
description = "Rendering hardware interface over D3D12, Vulkan, Metal and console GPU APIs."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
marlin-error.workspace = true
# Validation messages, the loader library (Vulkan) and Win32 helpers (D3D12), descriptor free
# lists.
marlin-diag.workspace = true
marlin-pal.workspace = true
marlin-sync.workspace = true

# The D3D12 backend (Xbox): D3D12 and DXGI are not in windows-sys; their COM interfaces are bound
# by hand in src/backend/d3d12/com.rs. windows-sys covers the Win32 parts. Vulkan is bound by hand
# too (src/backend/vulkan/ffi).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[dev-dependencies]
marlin-app.workspace = true
marlin-gpu-test-support.workspace = true
marlin-test-support.workspace = true
