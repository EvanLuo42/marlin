[package]
name = "marlin-input"
description = "Keyboard, mouse, gamepad and touch input."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Same-layer dependency: desktop keyboard and mouse input arrives through the app's message pump.
marlin-app.workspace = true
marlin-pal.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }
