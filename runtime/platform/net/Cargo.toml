[package]
name = "marlin-net"
description = "Completion-based TCP sockets and name resolution."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
marlin-error.workspace = true
marlin-io.workspace = true
marlin-pal.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
marlin-bench.workspace = true
marlin-math.workspace = true
marlin-test-support.workspace = true

[[bench]]
name = "loopback"
harness = false

[lints]
workspace = true
