[alias]
xtask = "run --package xtask --"

# Note: a RUSTFLAGS / CARGO_ENCODED_RUSTFLAGS environment variable replaces these flags entirely.

# BEGIN gen-cfg (generated by `cargo xtask gen-cfg` from platforms/*/platform.toml; do not edit)
[target.x86_64-unknown-linux-gnu]
rustflags = ["--cfg", 'marlin_platform="linux"']
rustdocflags = ["--cfg", 'marlin_platform="linux"']
[target.aarch64-unknown-linux-gnu]
rustflags = ["--cfg", 'marlin_platform="linux"']
rustdocflags = ["--cfg", 'marlin_platform="linux"']
[target.aarch64-apple-darwin]
rustflags = ["--cfg", 'marlin_platform="macos"']
rustdocflags = ["--cfg", 'marlin_platform="macos"']
[target.x86_64-apple-darwin]
rustflags = ["--cfg", 'marlin_platform="macos"']
rustdocflags = ["--cfg", 'marlin_platform="macos"']
[target.x86_64-pc-windows-msvc]
rustflags = ["--cfg", 'marlin_platform="windows"', "--cfg", 'marlin_ext="large_pages"']
rustdocflags = ["--cfg", 'marlin_platform="windows"', "--cfg", 'marlin_ext="large_pages"']
[target.aarch64-pc-windows-msvc]
rustflags = ["--cfg", 'marlin_platform="windows"', "--cfg", 'marlin_ext="large_pages"']
rustdocflags = ["--cfg", 'marlin_platform="windows"', "--cfg", 'marlin_ext="large_pages"']
# END gen-cfg
